<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 468" width="1280" height="468" role="img" aria-labelledby="lifecycle-title lifecycle-desc">
        <title id="lifecycle-title">Software factory lifecycle</title>
        <desc id="lifecycle-desc">Six stages from Plan to Maintain, each listing the file it commits, the person who signs off, and the third-party skills it uses, with Maintain feeding new intent back into Plan.</desc>
  <style>
  .bg { fill: #f5f5f5; }
  .mask { fill: #f5f5f5; }
  .node { fill: #ffffff; stroke: rgba(45,49,66,0.28); stroke-width: 1; }
  .node-light { fill: #f5f5f5; stroke: rgba(45,49,66,0.28); stroke-width: 1; stroke-dasharray: 4 3; }
  .focal { fill: rgba(191,69,32,0.08); stroke: #bf4520; stroke-width: 1.2; }
  .sec { fill: rgba(191,69,32,0.05); stroke: rgba(191,69,32,0.55); stroke-width: 1; stroke-dasharray: 4 4; }
  .tag { fill: none; stroke: rgba(45,49,66,0.28); stroke-width: 0.8; }
  .tag-accent { fill: none; stroke: #bf4520; stroke-width: 0.8; }
  .edge { fill: none; stroke: #4f5d75; stroke-width: 1; }
  .edge-dash { fill: none; stroke: #4f5d75; stroke-width: 1; stroke-dasharray: 5 4; }
  .hair { stroke: rgba(45,49,66,0.12); stroke-width: 0.8; }
  .mk { fill: #4f5d75; }
  .t-name { fill: #2d3142; font-family: 'Geist', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 12px; }
  .t-head { fill: #2d3142; font-family: 'Geist', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 14px; }
  .t-sub { fill: #4f5d75; font-family: 'Geist Mono', 'Cascadia Mono', Consolas, Menlo, monospace; font-size: 9px; }
  .t-code { fill: #2d3142; font-family: 'Geist Mono', 'Cascadia Mono', Consolas, Menlo, monospace; font-size: 9px; }
  .t-eyebrow { fill: #4f5d75; font-family: 'Geist Mono', 'Cascadia Mono', Consolas, Menlo, monospace; font-size: 8px; font-weight: 500; letter-spacing: 0.18em; }
  .t-tag { fill: #4f5d75; font-family: 'Geist Mono', 'Cascadia Mono', Consolas, Menlo, monospace; font-size: 7px; letter-spacing: 0.08em; }
  .t-tag-accent { fill: #bf4520; font-family: 'Geist Mono', 'Cascadia Mono', Consolas, Menlo, monospace; font-size: 7px; letter-spacing: 0.08em; }
  .t-label { fill: #5a6580; font-family: 'Geist Mono', 'Cascadia Mono', Consolas, Menlo, monospace; font-size: 8px; letter-spacing: 0.06em; }
  .t-legend { fill: #4f5d75; font-family: 'Geist Mono', 'Cascadia Mono', Consolas, Menlo, monospace; font-size: 8px; }
  .t-callout { fill: #4f5d75; font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-style: italic; font-size: 14px; }
  .t-skip { fill: #5a6580; font-family: 'Geist', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 12px; }
  </style>
        <defs>
          <marker id="lc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="mk" points="0 0, 8 3, 0 6"/></marker>
        </defs>
        <rect class="bg" width="1280" height="468"/>

        <!-- Connectors first -->
        <path class="edge-dash" d="M1152,72 V48 Q1152,40 1144,40 H240 Q232,40 232,48 V72" marker-end="url(#lc-arrow)"/>
        <rect class="mask" x="660" y="22" width="64" height="12" rx="2"/>
        <text class="t-label" x="692" y="31" text-anchor="middle">NEW INTENT</text>
        <path class="edge" d="M312,104 H336" marker-end="url(#lc-arrow)"/>
        <path class="edge" d="M496,104 H520" marker-end="url(#lc-arrow)"/>
        <path class="edge" d="M680,104 H704" marker-end="url(#lc-arrow)"/>
        <path class="edge" d="M864,104 H888" marker-end="url(#lc-arrow)"/>
        <path class="edge" d="M1048,104 H1072" marker-end="url(#lc-arrow)"/>

        <!-- Row labels -->
        <text class="t-eyebrow" x="24" y="101">STAGE</text>
        <text class="t-eyebrow" x="24" y="185">ARTIFACT</text>
        <text class="t-sub" x="24" y="199">committed file</text>
        <text class="t-eyebrow" x="24" y="261">HUMAN GATE</text>
        <text class="t-sub" x="24" y="275">who signs off</text>
        <text class="t-eyebrow" x="24" y="337">SKILLS</text>
        <text class="t-sub" x="24" y="351">third-party</text>

        <!-- Stage headers -->
        <g>
          <rect class="node" x="152" y="72" width="160" height="64" rx="6"/>
          <rect class="tag" x="160" y="80" width="20" height="12" rx="2"/><text class="t-tag" x="170" y="89" text-anchor="middle">01</text>
          <text class="t-head" x="232" y="106" text-anchor="middle">Plan</text>
          <text class="t-sub" x="232" y="124" text-anchor="middle">research · grill · decide</text>
        </g>
        <g>
          <rect class="node" x="336" y="72" width="160" height="64" rx="6"/>
          <rect class="tag" x="344" y="80" width="20" height="12" rx="2"/><text class="t-tag" x="354" y="89" text-anchor="middle">02</text>
          <text class="t-head" x="416" y="106" text-anchor="middle">Design</text>
          <text class="t-sub" x="416" y="124" text-anchor="middle">spec · two reviewers</text>
        </g>
        <g>
          <rect class="mask" x="520" y="72" width="160" height="64" rx="6"/>
          <rect class="focal" x="520" y="72" width="160" height="64" rx="6"/>
          <rect class="tag-accent" x="528" y="80" width="20" height="12" rx="2"/><text class="t-tag-accent" x="538" y="89" text-anchor="middle">03</text>
          <text class="t-head" x="600" y="106" text-anchor="middle">Build</text>
          <text class="t-sub" x="600" y="124" text-anchor="middle">plan · task loop</text>
        </g>
        <g>
          <rect class="node" x="704" y="72" width="160" height="64" rx="6"/>
          <rect class="tag" x="712" y="80" width="20" height="12" rx="2"/><text class="t-tag" x="722" y="89" text-anchor="middle">04</text>
          <text class="t-head" x="784" y="106" text-anchor="middle">Test</text>
          <text class="t-sub" x="784" y="124" text-anchor="middle">verify · demo</text>
        </g>
        <g>
          <rect class="node" x="888" y="72" width="160" height="64" rx="6"/>
          <rect class="tag" x="896" y="80" width="20" height="12" rx="2"/><text class="t-tag" x="906" y="89" text-anchor="middle">05</text>
          <text class="t-head" x="968" y="106" text-anchor="middle">Deploy</text>
          <text class="t-sub" x="968" y="124" text-anchor="middle">merge · CI · release</text>
        </g>
        <g>
          <rect class="node" x="1072" y="72" width="160" height="64" rx="6"/>
          <rect class="tag" x="1080" y="80" width="20" height="12" rx="2"/><text class="t-tag" x="1090" y="89" text-anchor="middle">06</text>
          <text class="t-head" x="1152" y="106" text-anchor="middle">Maintain</text>
          <text class="t-sub" x="1152" y="124" text-anchor="middle">monitor · triage · learn</text>
        </g>

        <!-- ARTIFACT row (y 160) -->
        <rect class="node" x="152" y="160" width="160" height="56" rx="6"/>
        <text class="t-name" x="232" y="184" text-anchor="middle">Intent + decisions</text>
        <text class="t-sub" x="232" y="200" text-anchor="middle">intent.md · decisions.md</text>
        <rect class="node" x="336" y="160" width="160" height="56" rx="6"/>
        <text class="t-name" x="416" y="184" text-anchor="middle">Reviewed spec</text>
        <text class="t-sub" x="416" y="200" text-anchor="middle">spec.md · reviews/</text>
        <rect class="node" x="520" y="160" width="160" height="56" rx="6"/>
        <text class="t-name" x="600" y="184" text-anchor="middle">Plan + commits</text>
        <text class="t-sub" x="600" y="200" text-anchor="middle">plan.md · stable task ids</text>
        <rect class="node" x="704" y="160" width="160" height="56" rx="6"/>
        <text class="t-name" x="784" y="184" text-anchor="middle">Evidence</text>
        <text class="t-sub" x="784" y="200" text-anchor="middle">verify log · demo.md</text>
        <rect class="node" x="888" y="160" width="160" height="56" rx="6"/>
        <text class="t-name" x="968" y="184" text-anchor="middle">Merge + release</text>
        <text class="t-sub" x="968" y="200" text-anchor="middle">PR if used · CHANGELOG</text>
        <rect class="node" x="1072" y="160" width="160" height="56" rx="6"/>
        <text class="t-name" x="1152" y="184" text-anchor="middle">Signals + lessons</text>
        <text class="t-sub" x="1152" y="200" text-anchor="middle">incident → intent.md</text>

        <!-- HUMAN GATE row (y 236) -->
        <rect class="node" x="152" y="236" width="160" height="56" rx="6"/>
        <text class="t-name" x="232" y="260" text-anchor="middle">Owner accepts intent</text>
        <text class="t-sub" x="232" y="276" text-anchor="middle">merge records decision</text>
        <rect class="node" x="336" y="236" width="160" height="56" rx="6"/>
        <text class="t-name" x="416" y="260" text-anchor="middle">Owner approves spec</text>
        <text class="t-sub" x="416" y="276" text-anchor="middle">go / no-go</text>
        <rect class="node" x="520" y="236" width="160" height="56" rx="6"/>
        <text class="t-name" x="600" y="260" text-anchor="middle">Owner accepts plan</text>
        <text class="t-sub" x="600" y="276" text-anchor="middle">then runs on its own</text>
        <rect class="node" x="704" y="236" width="160" height="56" rx="6"/>
        <text class="t-name" x="784" y="260" text-anchor="middle">Owner reviews demo</text>
        <text class="t-sub" x="784" y="276" text-anchor="middle">pasted output, not "done"</text>
        <rect class="node" x="888" y="236" width="160" height="56" rx="6"/>
        <text class="t-name" x="968" y="260" text-anchor="middle">Human merges</text>
        <text class="t-sub" x="968" y="276" text-anchor="middle">author never approves</text>
        <rect class="node" x="1072" y="236" width="160" height="56" rx="6"/>
        <text class="t-name" x="1152" y="260" text-anchor="middle">On-call triages</text>
        <text class="t-sub" x="1152" y="276" text-anchor="middle">breach → new intent</text>

        <!-- SKILLS row (y 312) -->
        <rect class="node" x="152" y="312" width="160" height="56" rx="6"/>
        <text class="t-code" x="232" y="336" text-anchor="middle">grilling · research</text>
        <text class="t-sub" x="232" y="352" text-anchor="middle">domain-modeling</text>
        <rect class="node" x="336" y="312" width="160" height="56" rx="6"/>
        <text class="t-code" x="416" y="336" text-anchor="middle">to-spec · codebase-design</text>
        <text class="t-sub" x="416" y="352" text-anchor="middle">diagram-design</text>
        <rect class="node" x="520" y="312" width="160" height="56" rx="6"/>
        <text class="t-code" x="600" y="336" text-anchor="middle">writing-plans · tdd</text>
        <text class="t-sub" x="600" y="352" text-anchor="middle">to-tickets · implement</text>
        <rect class="node" x="704" y="312" width="160" height="56" rx="6"/>
        <text class="t-code" x="784" y="336" text-anchor="middle">tdd · diagnosing-bugs</text>
        <text class="t-sub" x="784" y="352" text-anchor="middle">superpowers: verification</text>
        <rect class="node" x="888" y="312" width="160" height="56" rx="6"/>
        <text class="t-code" x="968" y="336" text-anchor="middle">code-review</text>
        <text class="t-sub" x="968" y="352" text-anchor="middle">security-review</text>
        <rect class="node" x="1072" y="312" width="160" height="56" rx="6"/>
        <text class="t-code" x="1152" y="336" text-anchor="middle">triage</text>
        <text class="t-sub" x="1152" y="352" text-anchor="middle">incident-response</text>

        <text class="t-callout" x="600" y="396" text-anchor="middle">Figure 3 zooms into this loop</text>

        <!-- Legend -->
        <line class="hair" x1="24" y1="420" x2="1256" y2="420"/>
        <text class="t-eyebrow" x="24" y="444">LEGEND</text>
        <rect class="mask" x="96" y="434" width="20" height="14" rx="3"/>
        <rect class="focal" x="96" y="434" width="20" height="14" rx="3"/>
        <text class="t-legend" x="124" y="444">Focal stage, detailed in Figure 3</text>
        <path class="edge" d="M352,441 H384" marker-end="url(#lc-arrow)"/>
        <text class="t-legend" x="392" y="444">Handoff: the committed file starts the next stage</text>
        <path class="edge-dash" d="M676,441 H708" marker-end="url(#lc-arrow)"/>
        <text class="t-legend" x="716" y="444">Return path</text>
      </svg>
